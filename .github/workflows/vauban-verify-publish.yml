name: Publish vauban-verify to PyPI

# Sigstore-signed publication via PyPI Trusted Publishers (OIDC).
# Trigger: tag matching `vauban-verify-vX.Y.Z`.
# No PyPI API token in the repo — auth happens via short-lived OIDC token.

on:
  push:
    tags:
      - "vauban-verify-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, do not publish"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hatch
        run: python -m pip install --upgrade pip hatch

      - name: Build distributions
        
        run: hatch build

      - name: List artefacts
        
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vauban-verify-dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publisher)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    environment:
      name: pypi
      url: https://pypi.org/p/vauban-verify
    permissions:
      id-token: write # required for Trusted Publisher OIDC
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vauban-verify-dist
          path: dist/

      - name: Publish via Trusted Publisher (sigstore-signed)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No `password:` — Trusted Publisher OIDC handles auth.
          # Configure on PyPI: project settings → publishing → add trusted
          # publisher with workflow `vauban-verify-publish.yml`.
